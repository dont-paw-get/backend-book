# dev 전용: 관리 포트(8081)를 Service에 metrics 포트로 노출한다.
# ServiceMonitor(servicemonitor.yaml)가 이 포트 이름(metrics)으로 스크레이핑 대상을 지정한다.
# 기존 http 포트(80 → 8080)는 그대로 두고, ALB Ingress는 http만 사용한다.
apiVersion: v1
kind: Service
metadata:
  name: backend-book
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: management
