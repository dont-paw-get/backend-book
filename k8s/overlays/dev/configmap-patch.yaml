# 개발 환경에서 base ConfigMap 위에 덮어쓸 값
# AUTH_ISSUER_URI / AUTH_APP_CLIENT_ID 는 dev Cognito User Pool(ap-northeast-2_y1mKz50El) 값
# AUTH_APP_CLIENT_ID 는 backend-auth 가 로그인/토큰 발급에 쓰는 Cognito Backend App Client 와
# 반드시 같아야 한다 — 프론트엔드는 Cognito 와 직접 로그인하지 않고, backend-auth 가 이 App Client
# 로 발급한 Access Token 이 그대로 Book Service 에 전달되기 때문이다. 이 값이 어긋나면 서명·issuer·
# token_use 를 모두 통과한 뒤 client_id 불일치로 전부 401 이 된다.
# 대응 원본: backend-auth 저장소 k8s/overlays/dev/configmap-patch.yaml 의 COGNITO_BACKEND_CLIENT_ID
# (CLIAR-162 Phase 7 에서 예전 FE App Client 는 폐기됨 / CLIAR-188)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-book-config
data:
  AUTH_ISSUER_URI: "https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_y1mKz50El"
  AUTH_APP_CLIENT_ID: "du6sabh7hm17goodv6sd2n9ag"
