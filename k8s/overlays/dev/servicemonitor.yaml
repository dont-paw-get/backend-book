# infra(dont-paw-get/infra)의 Prometheus가 이 서비스의 Micrometer HTTP 메트릭을 스크레이핑하도록 한다.
# infra Prometheus는 serviceMonitorSelectorNilUsesHelmValues=false라 네임스페이스·라벨 셀렉터 제약이 없다 —
# 이 ServiceMonitor가 backend-book Service를 selector로 맞히기만 하면 스크레이핑된다.
#
# 네임스페이스는 overlay kustomization.yaml의 `namespace: dpyb-book-dev` 트랜스포머가 주입한다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-book
  labels:
    app.kubernetes.io/name: backend-book
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-book
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
      scheme: http
