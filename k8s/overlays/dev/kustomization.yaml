apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 개발 환경 (develop 브랜치 → dpyb-book-dev 네임스페이스)
namespace: dpyb-book-dev

resources:
  - ../../base
  # Prometheus 스크레이핑(infra 연동) — dev 전용
  - servicemonitor.yaml

# 개발은 1개만
replicas:
  - name: backend-book
    count: 1

# 개발용 이미지. CI 가 newTag 를 커밋 SHA 로 갱신합니다.
images:
  - name: backend-book
    newName: 594532711953.dkr.ecr.ap-northeast-2.amazonaws.com/dpyb-dev/dpyb-book
    newTag: 185f7783b88d584d42cae7613dac7941b6161fd6

# 개발 환경에서 달라지는 설정값만 덮어씀
patches:
  - path: configmap-patch.yaml
  # 관리 포트(8081) — Prometheus 메트릭 전용, ALB 미노출
  - path: deployment-patch.yaml
  - path: service-patch.yaml
