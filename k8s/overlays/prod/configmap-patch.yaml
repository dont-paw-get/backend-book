# 상용 환경에서 base ConfigMap 위에 덮어쓸 값
# AUTH_ISSUER_URI / AUTH_APP_CLIENT_ID 는 Cognito User Pool 값
# AUTH_APP_CLIENT_ID 는 backend-auth 가 쓰는 Cognito Backend App Client ID 여야 한다(CLIAR-188).
# 지금은 아래 TODO 대로 dev User Pool 을 공용하므로 dev overlay 와 같은 값이다. 다만 backend-auth
# prod overlay 에는 아직 COGNITO_BACKEND_CLIENT_ID 가 없어(placeholder 상태), 상용 전용 User Pool
# 전환 시 backend-auth prod 설정과 함께 맞춰야 한다.
# TODO: 지금은 CD 파이프라인 검증을 위해 dev와 동일한 User Pool을 공용한다.
#       상용 전용 User Pool이 준비되면 그 값으로 교체할 것. (.harness/BACKLOG.md 참조)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-book-config
data:
  AUTH_ISSUER_URI: 'https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_y1mKz50El'
  AUTH_APP_CLIENT_ID: 'du6sabh7hm17goodv6sd2n9ag'

  # OpenTelemetry Collector 주소. 프로토콜(http/protobuf)과 service.name 은 base ConfigMap 에 있다.
  # TODO: dev overlay 와 마찬가지로 OTel Collector 차트의 관례 기본값이다. 상용 클러스터(dpyb-prod)에
  #       Collector 가 배포되면 실제 Service 이름/네임스페이스로 교체할 것. (.harness/BACKLOG.md 참조)
  #       엔드포인트에 닿지 못해도 span export 만 실패하고 비즈니스 요청은 정상 처리된다.
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://opentelemetry-collector.observability.svc.cluster.local:4318'
  # Tempo/Loki 에서 dev/prod 를 가르는 표준 resource attribute
  OTEL_RESOURCE_ATTRIBUTES: 'deployment.environment.name=prod'
  # prod 기본값은 10% 샘플링이다. 운영 중 조정이 필요하면 이 env 만 바꾼다.
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '0.1'
