# ⚠️ 이 파일은 "예시" 입니다. 실제 비밀값을 여기에 적어 Git 에 커밋하지 마세요.
# ArgoCD Application 에서 *.example.yaml 은 제외하도록 설정되어 있습니다.
#
# 실제 Secret 생성 방법 (택 1):
#
# 1) kubectl 로 직접 생성 (가장 간단, 클러스터에만 존재하고 Git 에는 안 올라감)
#    kubectl create secret generic backend-book-secret \
#      --namespace dpyb-book-dev \
#      --from-literal=DB_URL='jdbc:postgresql://<host>:5432/<database>' \
#      --from-literal=DB_USERNAME='<user>' \
#      --from-literal=DB_PASSWORD='<password>' \
#      --from-literal=ALADIN_API_TTB_KEY='<aladin-ttb-key>'
#
# 2) SealedSecrets / External Secrets Operator 를 써서 암호화된 형태로 Git 관리 (권장, 운영환경)
#    - SealedSecrets: kubeseal 로 암호화한 SealedSecret 을 커밋
#    - External Secrets: AWS Secrets Manager / SSM Parameter Store 와 연동
#
# 아래는 참고용 구조입니다.
apiVersion: v1
kind: Secret
metadata:
  name: backend-book-secret
  namespace: dpyb-book-dev
  labels:
    app.kubernetes.io/name: backend-book
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://<host>:5432/<database>"
  DB_USERNAME: "<user>"
  DB_PASSWORD: "<password>"
  ALADIN_API_TTB_KEY: "<aladin-ttb-key>"
