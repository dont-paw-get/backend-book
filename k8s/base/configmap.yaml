apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-book-config
  labels:
    app.kubernetes.io/name: backend-book
# 민감하지 않은 설정값만 여기에 둡니다.
# DB 접속정보, 알라딘 API 키 등 비밀값은 Secret 에 둡니다.
# AUTH_ISSUER_URI/AUTH_APP_CLIENT_ID(Cognito)는 환경별로 다른 User Pool을 쓸 수 있어
# overlay 의 configmap-patch.yaml 에서 채웁니다.
# OTEL_EXPORTER_OTLP_ENDPOINT/OTEL_RESOURCE_ATTRIBUTES 도 환경별로 달라 overlay 에서 채웁니다.
data:
  # local(H2 없는 로컬 Docker Postgres) 프로필과 달리, 배포 환경은 항상
  # env var 기반 datasource(application-prod.yaml)를 쓴다 — dev/prod 네임스페이스
  # 구분은 overlay(namespace/replicas/configmap 값)로 하고, Spring 프로필은 "prod" 하나로 통일한다.
  SPRING_PROFILES_ACTIVE: "prod"

  # ── 관측(Observability) ───────────────────────────────────────────────
  # Spring Boot 4.1 의 spring-boot-opentelemetry 가 OTEL_* 표준 환경변수를 그대로 읽는다
  # (OpenTelemetryEnvironmentVariableEnvironmentPostProcessor). 그래서 OTLP 엔드포인트를
  # 코드나 application.yaml 에 하드코딩하지 않고 여기서만 준다.
  #
  # 로그는 컨테이너 stdout 으로만 나가고(파일 없음) 노드의 Grafana Alloy 가 수집해 Loki 로 넘긴다.
  # 이 저장소의 책임은 "JSON 한 줄을 stdout 에 쓴다"까지다(application-prod.yaml 의 logging.structured).
  #
  # service.name. 애플리케이션이 이 값을 로그의 service 필드에도 함께 쓰므로 Loki 와 Tempo 의
  # 서비스 이름이 어긋나지 않는다.
  OTEL_SERVICE_NAME: "backend-book"
  # HTTP(4318). 경로(/v1/traces)는 Boot 가 엔드포인트 뒤에 자동으로 붙인다.
  # grpc 로 바꾸려면 이 값과 overlay 의 포트(4317)를 같이 바꿔야 한다.
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
