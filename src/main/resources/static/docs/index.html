<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Book Service API 문서</title>
    <link rel="stylesheet" href="/webjars/swagger-ui/5.25.3/swagger-ui.css" />
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="/webjars/swagger-ui/5.25.3/swagger-ui-bundle.js"></script>
    <script src="/webjars/swagger-ui/5.25.3/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = () => {
            window.ui = SwaggerUIBundle({
                url: '/openapi.yaml',
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                plugins: [SwaggerUIBundle.plugins.DownloadUrl],
                layout: 'StandaloneLayout',
            });
        };
    </script>
</body>
</html>
