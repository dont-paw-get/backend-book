          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0

    ScrapDetailResponse:
      type: object
      additionalProperties: false
      required: [scrapId, bookId, sentence, createdAt, updatedAt]
      properties:
        scrapId:
          type: integer
          format: int64
          minimum: 1
        bookId:
          type: integer
          format: int64
          minimum: 1
        sentence:
          type: string
        pageNumber:
          type: [integer, "null"]
          format: int32
          minimum: 1
        memo:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LibrarianType:
      type: string
      description: 사서 마스터 정보에 등록된 동물 종류. 새로운 종류가 추가될 수 있어 고정 enum 대신 서버가 관리하는 문자열이다.
      minLength: 1
      maxLength: 30
      example: CAT

