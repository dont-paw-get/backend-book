          type: string
          minLength: 1
          maxLength: 50
        type:
          $ref: "#/components/schemas/LibrarianType"
        imageUrl:
          type: string
          format: uri
        evolutionStage:
          type: integer
          format: int32
          minimum: 1
          description: 사서 마스터 정보에 정의된 진화 단계 번호

    LibrarianListResponse:
      type: object
