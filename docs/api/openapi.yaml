openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Virtual Shelf Book Service API
  version: 0.2.0
  description: |
    Virtual Shelf MSA의 Book Service 계약이다.
    알라딘 API 기반 외부 도서 검색, 개인 서재 관리, 독서 진도, 문장 스크랩, 동물 사서를 제공한다.

    표지 OCR과 AI 기반 도서/무드 분석은 다른 MSA 컴포넌트가 담당하며 이 계약의 범위 밖이다.
    이 API Server는 이미 인식된 제목/저자를 넘겨받아 외부 도서 API 조회, 독서 진도 계산,
    서재·스크랩·동물 사서 CRUD 등 단순 데이터베이스 CRUD로 해결 가능한 부분만 다룬다.

    모든 API는 인증이 필요하다. 사용자 식별자는 요청 body가 아니라 검증된 인증 principal에서 얻는다.
  contact:
    name: Virtual Shelf Book Service Team
servers:
  - url: /
    description: 현재 호스트
security:
  - bearerAuth: []
tags:
  - name: Book Discovery
    description: 인식된 제목/저자를 이용한 알라딘 외부 도서 검색
  - name: Library
    description: 로그인 사용자의 개인 서재 관리
  - name: Reading Progress
    description: 개인 서재 도서의 독서 진도 관리
  - name: Scrap
    description: 서재 도서에 연결된 문장 스크랩 관리
  - name: Librarian
    description: 동물 사서 마스터 정보와 대표 사서 선택

paths:
  /api/v1/books/search:
    get:
      tags: [Book Discovery]
      operationId: searchBookInfo
      summary: 도서 정보 조회
      description: |
        인식되었거나 사용자가 입력한 제목/저자를 기반으로 알라딘 API를 검색한다.
        title과 author 중 하나 이상은 공백이 아닌 값이어야 한다.
        검색 결과가 없으면 200과 빈 books 배열을 반환한다(사용자가 수동으로 도서 정보를 입력하는 폴백 흐름으로 이어진다).
      parameters:
        - name: title
          in: query
          required: false
          description: 도서 제목
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: 어린 왕자
        - name: author
          in: query
          required: false
          description: 저자명
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: 생텍쥐페리
      responses:
        "200":
          description: 도서 검색 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchResponse"
              example:
                books:
                  - title: 어린 왕자
                    author: 앙투안 드 생텍쥐페리
                    isbn: "9788932917245"
                    publisher: 열린책들
                    publishedDate: "2015-10-20"
                    totalPages: 160
                    coverUrl: https://example.com/covers/9788932917245.jpg
        "400":
          $ref: "#/components/responses/InvalidSearchParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AladinApiError"

  /api/v1/library/books:
    post:
      tags: [Library]
      operationId: createLibraryBook
      summary: 서재 책 등록
      description: |
        사용자가 최종 확인한 도서 정보를 로그인 사용자의 개인 서재에 등록한다.
        알라딘 검색 결과를 그대로 쓰거나, 결과가 없으면(폴백) 사용자가 직접 입력한 값을 그대로 받는다.
        `coverUrl`을 생략하지 않고 검색 결과의 실제 표지 URL을 그대로 전달하면 실제 표지가 기본 표지로 적용된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryBookRequest"
            example:
              title: 어린 왕자
              author: 앙투안 드 생텍쥐페리
              isbn: "9788932917245"
              publisher: 열린책들
              publishedDate: "2015-10-20"
              totalPages: 160
              coverUrl: https://example.com/covers/9788932917245.jpg
      responses:
        "201":
          description: 서재 책 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryBookResponse"
              example:
                bookId: 123
                bookNumber: 1
                title: 어린 왕자
                author: 앙투안 드 생텍쥐페리
                currentPage: 0
                progress: 0.0
        "400":
          $ref: "#/components/responses/InvalidCreateBookData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/BookAlreadyRegistered"

    get:
      tags: [Library]
      operationId: getLibraryBooks
      summary: 서재 도서 목록 조회
      description: 로그인 사용자의 서재에서 필터, 정렬, 페이지 조건에 맞는 도서를 조회한다.
      parameters:
        - name: author
          in: query
          required: false
          description: 저자명
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: readingStatus
          in: query
          required: false
          description: 독서 상태
          schema:
            $ref: "#/components/schemas/ReadingStatus"
        - name: sortBy
          in: query
          required: false
          description: 정렬 기준
          schema:
            type: string
            enum: [TITLE, AUTHOR, CREATED_AT, PROGRESS]
            default: CREATED_AT
        - name: sortOrder
          in: query
          required: false
          description: 정렬 방향
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지당 항목 수
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 서재 도서 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookPageResponse"
              example:
                books:
                  - bookId: 123
                    title: 살인자의 기억법
                    author: 김영하
                    coverUrl: https://example.com/covers/9791198765432.jpg
                    progress: 45.0
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        "400":
          $ref: "#/components/responses/InvalidFilterParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/library/books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Library]
      operationId: getLibraryBook
      summary: 서재 책 상세 조회
      description: 로그인 사용자의 서재에서 특정 도서의 상세 정보를 조회한다.
      responses:
        "200":
          description: 서재 책 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetailResponse"
              example:
                bookId: 123
                bookNumber: 1
                title: 어린 왕자
                author: 앙투안 드 생텍쥐페리
                isbn: "9788932917245"
                publisher: 열린책들
                totalPages: 160
                coverUrl: https://example.com/covers/9788932917245.jpg
                currentPage: 50
                progress: 31.25
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

    patch:
      tags: [Library]
      operationId: updateLibraryBook
      summary: 서재 책 정보 수정
      description: 로그인 사용자의 서재에 등록된 도서 정보를 부분 수정한다. 누락 필드는 기존 값을 유지한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryBookRequest"
            example:
              bookNumber: 2
              title: 어린 왕자
              author: 생택쥐페리
              isbn: "9788932917245"
              publisher: 열린책들
              publishedDate: "2015-10-20"
              totalPages: 158
      responses:
        "200":
          description: 서재 책 정보 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLibraryBookResponse"
              example:
                bookId: 123
                bookNumber: 2
                title: 어린 왕자
                totalPages: 158
                updatedAt: "2026-08-17T01:10:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidUpdateBookData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookUpdateAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookUpdateNotFound"

    delete:
      tags: [Library]
      operationId: deleteLibraryBook
      summary: 서재 책 삭제
      description: 로그인 사용자의 개인 서재에서 지정한 책을 삭제한다.
      responses:
        "204":
          description: 서재 책 삭제 성공. 응답 body 없음
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookDeleteAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookDeleteNotFound"

  /api/v1/library/books/{bookId}/progress:
    parameters:
      - $ref: "#/components/parameters/BookId"
    patch:
      tags: [Reading Progress]
      operationId: updateReadingProgress
      summary: 독서 진도 수정
      description: |
        현재/전체 페이지를 수정하고 진도율과 독서 상태를 서버에서 계산한다.
        현재 페이지가 전체 페이지에 도달하면 COMPLETED로 변경한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingProgressRequest"
            example:
              currentPage: 80
              totalPages: 160
      responses:
        "200":
          description: 독서 진도 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReadingProgressResponse"
              example:
                bookId: 123
                currentPage: 80
                totalPages: 160
                progress: 50.0
                readingStatus: READING
                updatedAt: "2026-08-17T21:30:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidPageValue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookProgressAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookProgressNotFound"

  /api/v1/library/books/{bookId}/scraps:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [Scrap]
      operationId: createScrap
      summary: 스크랩 생성
      description: OCR 결과 또는 직접 입력한 문장을 현재 선택한 책과 연결하여 스크랩으로 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScrapRequest"
            example:
              sentence: 어른들은 누구나 처음엔 어린이였다.
              pageNumber: 12
              memo: 이 문장이 계속 마음에 남는다.
      responses:
        "201":
          description: 스크랩 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다.
                pageNumber: 12
                memo: 이 문장이 계속 마음에 남는다.
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidScrapData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

    get:
      tags: [Scrap]
      operationId: getScraps
      summary: 책별 스크랩 목록 조회
      description: 로그인 사용자가 특정 책에 저장한 스크랩 목록을 조회한다.
      parameters:
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지당 항목 수
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 책별 스크랩 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapPageResponse"
              example:
                scraps:
                  - scrapId: 456
                    sentence: 어른들은 누구나 처음엔 어린이였다.
                    pageNumber: 12
                    createdAt: "2026-08-20T10:00:00+09:00"
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

  /api/v1/library/scraps/{scrapId}:
    parameters:
      - $ref: "#/components/parameters/ScrapId"
    get:
      tags: [Scrap]
      operationId: getScrap
      summary: 스크랩 상세 조회
      description: 저장된 문장과 페이지 번호, 감상 및 메모 등 스크랩 상세 정보를 조회한다.
      responses:
        "200":
          description: 스크랩 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다.
                pageNumber: 12
                memo: 이 문장이 계속 마음에 남는다.
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:00:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

    patch:
      tags: [Scrap]
      operationId: updateScrap
      summary: 스크랩 문장/페이지/메모 수정
      description: |
        스크랩의 문장, 페이지 번호, 감상 및 메모를 수정한다.
        `sentence`, `pageNumber`, `memo`는 항상 모두 포함해야 한다(생략 불가).
        `pageNumber`/`memo`에 `null`을 보내면 해당 값을 삭제하고, 값을 보내면 그 값으로 교체한다.
        `sentence`는 `null`을 허용하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScrapRequest"
            example:
              sentence: 어른들은 누구나 처음엔 어린이였다. 그것을 기억하는 어른은 별로 없지만.
              pageNumber: 12
              memo: null
      responses:
        "200":
          description: 스크랩 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다. 그것을 기억하는 어른은 별로 없지만.
                pageNumber: 12
                memo: null
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:20:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidScrapData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

    delete:
      tags: [Scrap]
      operationId: deleteScrap
      summary: 스크랩 삭제
      description: 사용자가 자신이 저장한 스크랩을 삭제한다.
      responses:
        "204":
          description: 스크랩 삭제 성공. 응답 body 없음
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

  /api/v1/librarians:
    get:
      tags: [Librarian]
      operationId: getLibrarians
      summary: 동물 사서 마스터 목록 조회
      description: 대표 사서로 선택 가능한 동물 사서(고양이, 새, 곰, 달팽이 등)의 기본 정보를 조회한다.
      responses:
        "200":
          description: 사서 마스터 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarianListResponse"
              example:
                librarians:
                  - librarianId: 1
                    name: 나비
                    type: CAT
                    imageUrl: https://example.com/librarians/cat-1.png
                    evolutionStage: 1
                  - librarianId: 2
                    name: 부엉
                    type: BIRD
                    imageUrl: https://example.com/librarians/bird-1.png
                    evolutionStage: 1
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/members/me/librarian:
    get:
      tags: [Librarian]
      operationId: getMyLibrarian
      summary: 내 대표 사서 조회
      description: 로그인 사용자가 선택한 대표 사서를 조회한다.
      responses:
        "200":
          description: 대표 사서 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLibrarianResponse"
              example:
                librarianId: 1
                name: 나비
                type: CAT
                imageUrl: https://example.com/librarians/cat-1.png
                evolutionStage: 1
                selectedAt: "2026-08-20T09:00:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibrarianNotSelected"

    put:
      tags: [Librarian]
      operationId: selectMyLibrarian
      summary: 대표 사서 선택/변경
      description: 로그인 사용자가 제공되는 동물 사서 중 하나를 대표 사서로 선택하거나 다른 사서로 변경한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectLibrarianRequest"
            example:
              librarianId: 2
      responses:
        "200":
          description: 대표 사서 선택/변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLibrarianResponse"
              example:
                librarianId: 2
                name: 부엉
                type: BIRD
                imageUrl: https://example.com/librarians/bird-1.png
                evolutionStage: 1
                selectedAt: "2026-08-20T10:30:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LibrarianNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 인증 서비스가 발급하고 Book Service가 검증하는 access token

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      description: 개인 서재 도서 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 123

    ScrapId:
      name: scrapId
      in: path
      required: true
      description: 스크랩 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 456

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: 클라이언트 분기용 안정적인 오류 코드
        message:
          type: string
          minLength: 1
          description: 사용자에게 표시 가능한 한국어 오류 메시지

    ReadingStatus:
      type: string
      enum: [NOT_STARTED, READING, COMPLETED]

    ExternalBook:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            알라딘 응답은 "세네카 (지은이), 하와이 대저택 (편역)"처럼 역할 라벨이 붙은 결합 문자열이다.
            서버가 "(지은이)", "(옮긴이)", "(편역)" 등 역할 라벨을 제거하고 이름만 남긴 뒤,
            저자가 여럿이면 쉼표로 구분해 반환한다.
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        publisher:
          type: string
          maxLength: 100
        publishedDate:
          type: string
          format: date
        totalPages:
          type: integer
          format: int32
          minimum: 1
          description: 알라딘 API가 대부분의 도서에서 제공하지 않는 값이다. 없으면 생략되며, 이 경우 사용자가 서재 등록 시 직접 입력해야 한다.
        coverUrl:
          type: string
          format: uri

    BookSearchResponse:
      type: object
      additionalProperties: false
      required: [books]
      properties:
        books:
          type: array
          items:
            $ref: "#/components/schemas/ExternalBook"

    CreateLibraryBookRequest:
      type: object
      additionalProperties: false
      required: [title, author, totalPages]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        publisher:
          type: string
          maxLength: 100
        publishedDate:
          type: string
          format: date
        totalPages:
          type: integer
          format: int32
          minimum: 1
        coverUrl:
          type: string
          format: uri

    CreateLibraryBookResponse:
      type: object
      additionalProperties: false
      required: [bookId, bookNumber, title, author, currentPage, progress]
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        bookNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        author:
          type: string
        currentPage:
          type: integer
          format: int32
          minimum: 0
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 100

    LibraryBookSummary:
      type: object
      additionalProperties: false
      required: [bookId, title, author, progress]
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
        author:
          type: string
        coverUrl:
          type: string
          format: uri
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 100

    LibraryBookPageResponse:
      type: object
      additionalProperties: false
      required: [books, page, size, totalElements, totalPages]
      properties:
        books:
          type: array
          items:
            $ref: "#/components/schemas/LibraryBookSummary"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0

    LibraryBookDetailResponse:
      type: object
      additionalProperties: false
      required:
        - bookId
        - bookNumber
        - title
        - author
        - totalPages
        - currentPage
        - progress
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        bookNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        publisher:
          type: string
        totalPages:
          type: integer
          format: int32
          minimum: 1
        coverUrl:
          type: string
          format: uri
        currentPage:
          type: integer
          format: int32
          minimum: 0
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 100

    UpdateLibraryBookRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bookNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        publisher:
          type: string
          minLength: 1
          maxLength: 100
        publishedDate:
          type: string
          format: date
        coverUrl:
          type: string
          format: uri
        totalPages:
          type: integer
          format: int32
          minimum: 1

    UpdateLibraryBookResponse:
      type: object
      additionalProperties: false
      required: [bookId, bookNumber, title, totalPages, updatedAt]
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        bookNumber:
          type: integer
          format: int32
          minimum: 1
        title:
          type: string
        coverUrl:
          type: string
          format: uri
        totalPages:
          type: integer
          format: int32
          minimum: 1
        updatedAt:
          type: string
          format: date-time

    UpdateReadingProgressRequest:
      type: object
      additionalProperties: false
      required: [currentPage, totalPages]
      properties:
        currentPage:
          type: integer
          format: int32
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 1
      description: currentPage는 totalPages보다 클 수 없다.

    UpdateReadingProgressResponse:
      type: object
      additionalProperties: false
      required: [bookId, currentPage, totalPages, progress, readingStatus, updatedAt]
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        currentPage:
          type: integer
          format: int32
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 1
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 100
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        updatedAt:
          type: string
          format: date-time

    CreateScrapRequest:
      type: object
      additionalProperties: false
      required: [sentence]
      properties:
        sentence:
          type: string
          minLength: 1
          maxLength: 2000
        pageNumber:
          type: integer
          format: int32
          minimum: 1
        memo:
          type: string
          maxLength: 2000

    UpdateScrapRequest:
      type: object
      additionalProperties: false
      required: [sentence, pageNumber, memo]
      properties:
        sentence:
          type: string
          minLength: 1
          maxLength: 2000
        pageNumber:
          type: [integer, "null"]
          format: int32
          minimum: 1
        memo:
          type: [string, "null"]
          maxLength: 2000
      description: |
        세 필드 모두 항상 포함해야 한다. pageNumber/memo는 null이면 삭제, 값이 있으면 교체한다.
        sentence는 null을 허용하지 않는다.

    ScrapSummary:
      type: object
      additionalProperties: false
      required: [scrapId, sentence, createdAt]
      properties:
        scrapId:
          type: integer
          format: int64
          minimum: 1
        sentence:
          type: string
        pageNumber:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time

    ScrapPageResponse:
      type: object
      additionalProperties: false
