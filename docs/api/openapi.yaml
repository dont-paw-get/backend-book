openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Virtual Shelf Book Service API
  version: 0.9.0
  description: |
    Virtual Shelf MSA의 Book Service 계약이다.
    알라딘 API 기반 외부 도서 검색, 개인 서재 관리, 독서 진도, 문장 스크랩, 동물 사서를 제공한다.

    표지 OCR과 AI 기반 도서/무드 분석은 다른 MSA 컴포넌트가 담당하며 이 계약의 범위 밖이다.
    이 API Server는 이미 인식된 isbn을 넘겨받아 외부 도서 API 조회, 독서 진도 계산,
    서재·스크랩·동물 사서 CRUD 등 단순 데이터베이스 CRUD로 해결 가능한 부분만 다룬다.

    모든 API는 인증이 필요하다. 사용자 식별자는 요청 body가 아니라 검증된 인증 principal에서 얻는다.
  contact:
    name: Virtual Shelf Book Service Team
servers:
  - url: /
    description: 현재 호스트
security:
  - bearerAuth: []
tags:
  - name: Book Discovery
    description: 인식된 제목/저자를 이용한 알라딘 외부 도서 검색
  - name: Library
    description: 로그인 사용자의 개인 서재 관리
  - name: Shelf
    description: 로그인 사용자의 책장 생성·수정·삭제와 책장별 책 목록/이동 관리
  - name: Reading Progress
    description: 개인 서재 도서의 독서 진도 관리
  - name: Scrap
    description: 서재 도서에 연결된 문장 스크랩 관리
  - name: Librarian
    description: 동물 사서 타입 카탈로그 조회, 사서 획득·개명·방출, 대표 사서 지정/조회. Book Service가 소유한다(ADR-0011, ADR-0009 대체).

paths:
  /api/v1/books/search:
    get:
      tags: [Book Discovery]
      operationId: searchBookInfo
      summary: 도서 정보 조회
      description: |
        isbn으로 알라딘 API를 조회한다.
        로그인 사용자의 서재에 이미 그 isbn으로 등록된 책이 있으면 알라딘을 호출하지 않고 저장된 도서 데이터(`libraryBook`)를 그대로 반환한다.
        등록되어 있지 않으면 알라딘에서 조회해 `book`으로 반환하고, 알라딘에도 없으면 `book`이 생략된다(사용자가 수동으로 도서 정보를 입력하는 폴백 흐름으로 이어진다).
      parameters:
        - name: isbn
          in: query
          required: true
          description: ISBN-10 또는 ISBN-13
          schema:
            type: string
            pattern: "^(?:[0-9]{10}|[0-9]{13})$"
          example: "9788932917245"
      responses:
        "200":
          description: 도서 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchResponse"
              examples:
                알라딘에서_찾음:
                  value:
                    alreadyRegistered: false
                    book:
                      title: 어린 왕자
                      author: 앙투안 드 생텍쥐페리
                      isbn: "9788932917245"
                      publisher: 열린책들
                      publishedDate: "2015-10-20"
                      totalPages: 160
                      coverUrl: https://example.com/covers/9788932917245.jpg
                이미_서재에_등록됨:
                  value:
                    alreadyRegistered: true
                    libraryBook:
                      bookId: 123
                      shelfId: 1
                      shelfRank: "m"
                      title: 어린 왕자
                      author: 앙투안 드 생텍쥐페리
                      isbn: "9788932917245"
                      genre: NONE
                      publisher: 열린책들
                      totalPages: 160
                      coverUrl: https://example.com/covers/9788932917245.jpg
                      readingStatus: PLANNED
                      currentPage: 0
                      progress: 0.0
                알라딘에도_없음:
                  value:
                    alreadyRegistered: false
        "400":
          $ref: "#/components/responses/InvalidSearchParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/AladinApiError"

  /api/v1/library/books:
    post:
      tags: [Library]
      operationId: createLibraryBook
      summary: 서재 책 등록
      description: |
        사용자가 최종 확인한 도서 정보를 로그인 사용자의 개인 서재에 등록한다.
        알라딘 검색 결과를 그대로 쓰거나, 결과가 없으면(폴백) 사용자가 직접 입력한 값을 그대로 받는다.
        `coverUrl`을 생략하지 않고 검색 결과의 실제 표지 URL을 그대로 전달하면 실제 표지가 기본 표지로 적용된다.
        `shelfId`를 생략하면 사용자의 기본 책장에 등록된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryBookRequest"
            example:
              title: 어린 왕자
              author: 앙투안 드 생텍쥐페리
              isbn: "9788932917245"
              publisher: 열린책들
              publishedDate: "2015-10-20"
              totalPages: 160
              coverUrl: https://example.com/covers/9788932917245.jpg
      responses:
        "201":
          description: 서재 책 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryBookResponse"
              example:
                bookId: 123
                shelfId: 1
                shelfRank: "m"
                title: 어린 왕자
                author: 앙투안 드 생텍쥐페리
                genre: NONE
                readingStatus: PLANNED
                currentPage: 0
                progress: 0.0
        "400":
          $ref: "#/components/responses/InvalidCreateBookData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/BookAlreadyRegistered"

    get:
      tags: [Library]
      operationId: getLibraryBooks
      summary: 서재 도서 목록 조회
      description: |
        로그인 사용자의 서재에서 필터, 정렬, 페이지 조건에 맞는 도서를 조회한다.
        `shelfId`를 생략하면 모든 책장을 합산해 조회한다. `shelfId`를 지정하면 `GET /api/v1/library/shelves/{shelfId}/books`와 동일하게 그 책장의 책만 조회한다.
      parameters:
        - name: shelfId
          in: query
          required: false
          description: 특정 책장으로 좁혀 조회. 생략하면 전체 책장 합산
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: author
          in: query
          required: false
          description: 저자명
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sortBy
          in: query
          required: false
          description: 정렬 기준. SHELF_ORDER는 사용자가 재정렬한 서재 순서(`shelfRank` 오름차순이 자연스러운 진열 순서)다.
          schema:
            type: string
            enum: [SHELF_ORDER, TITLE, AUTHOR, CREATED_AT, PROGRESS]
            default: SHELF_ORDER
        - name: sortOrder
          in: query
          required: false
          description: 정렬 방향
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지당 항목 수
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 서재 도서 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookPageResponse"
              example:
                books:
                  - bookId: 123
                    shelfId: 1
                    shelfRank: "m"
                    title: 살인자의 기억법
                    author: 김영하
                    genre: MYSTERY_THRILLER
                    readingStatus: READING
                    coverUrl: https://example.com/covers/9791198765432.jpg
                    progress: 45.0
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        "400":
          $ref: "#/components/responses/InvalidFilterParameter"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/library/books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [Library]
      operationId: getLibraryBook
      summary: 서재 책 상세 조회
      description: 로그인 사용자의 서재에서 특정 도서의 상세 정보를 조회한다.
      responses:
        "200":
          description: 서재 책 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookDetailResponse"
              example:
                bookId: 123
                shelfId: 1
                shelfRank: "m"
                title: 어린 왕자
                author: 앙투안 드 생텍쥐페리
                isbn: "9788932917245"
                genre: NONE
                publisher: 열린책들
                totalPages: 160
                readingStatus: PLANNED
                coverUrl: https://example.com/covers/9788932917245.jpg
                currentPage: 50
                progress: 31.25
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

    patch:
      tags: [Library]
      operationId: updateLibraryBook
      summary: 서재 책 정보 수정
      description: |
        로그인 사용자의 서재에 등록된 도서 정보를 수정한다. 9개 필드를 항상 모두 포함해야 하며,
        `isbn`/`publisher`/`publishedDate`/`coverUrl`/`totalPages`에 `null`을 보내면 그 값을 삭제한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryBookRequest"
            example:
              title: 어린 왕자
              author: 생택쥐페리
              isbn: "9788932917245"
              publisher: 열린책들
              publishedDate: "2015-10-20"
              coverUrl: https://example.com/covers/9788932917245.jpg
              totalPages: 158
      responses:
        "200":
          description: 서재 책 정보 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateLibraryBookResponse"
              example:
                bookId: 123
                shelfRank: "m"
                title: 어린 왕자
                genre: NONE
                readingStatus: PLANNED
                totalPages: 158
                updatedAt: "2026-08-17T01:10:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidUpdateBookData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookUpdateAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookUpdateNotFound"

    delete:
      tags: [Library]
      operationId: deleteLibraryBook
      summary: 서재 책 삭제
      description: 로그인 사용자의 개인 서재에서 지정한 책을 삭제한다.
      responses:
        "204":
          description: 서재 책 삭제 성공. 응답 body 없음
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookDeleteAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookDeleteNotFound"

  /api/v1/library/books/{bookId}/order:
    parameters:
      - $ref: "#/components/parameters/BookId"
    patch:
      tags: [Library]
      operationId: reorderLibraryBook
      summary: 서재 책 순서 변경
      description: |
        지정한 책을 같은 책장 내 다른 책(`beforeBookId` 또는 `afterBookId`)의 앞/뒤로 옮긴다.
        서버가 두 이웃 책 사이에 들어갈 새 `shelfRank`를 계산해 저장하므로, 클라이언트는 `shelfRank` 값을 직접 계산하거나 지정하지 않는다.
        맨 앞/맨 뒤로 옮기려면 클라이언트가 이미 조회해 알고 있는 현재 첫 번째/마지막 책을 기준으로 지정한다.
        `shelfRank`는 책장별로 유일하므로, 다른 책장에 속한 책을 기준으로 지정할 수 없다(다른 책장으로 옮기려면 `moveLibraryBookToShelf`를 사용한다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderLibraryBookRequest"
            example:
              afterBookId: 456
      responses:
        "200":
          description: 서재 책 순서 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderLibraryBookResponse"
              example:
                bookId: 123
                shelfRank: "mV"
                updatedAt: "2026-08-20T01:10:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidReorderTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookReorderAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookReorderNotFound"

  /api/v1/library/books/{bookId}/shelf:
    parameters:
      - $ref: "#/components/parameters/BookId"
    patch:
      tags: [Shelf]
      operationId: moveLibraryBookToShelf
      summary: 책장에 책 넣기 (책 이동)
      description: |
        지정한 책을 다른 책장(`shelfId`)으로 옮긴다. 이동한 책은 대상 책장의 맨 뒤(`ShelfRank.after`)에 배치된다.
        대상 책장은 이 책을 소유한 사용자의 책장이어야 하며, 존재하지 않거나 다른 사용자 소유면 400(`INVALID_SHELF_TARGET`)이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveLibraryBookToShelfRequest"
            example:
              shelfId: 2
      responses:
        "200":
          description: 책장 이동 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveLibraryBookToShelfResponse"
              example:
                bookId: 123
                shelfId: 2
                shelfRank: "m"
                updatedAt: "2026-08-21T09:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidShelfTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookMoveAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookMoveNotFound"

  /api/v1/library/books/{bookId}/progress:
    parameters:
      - $ref: "#/components/parameters/BookId"
    patch:
      tags: [Reading Progress]
      operationId: updateReadingProgress
      summary: 독서 진도 수정
      description: |
        현재/전체 페이지를 수정하고 진도율을 서버에서 계산한다. `totalPages`를 모르면 생략할 수 있고,
        이 경우 `progress`는 null로 응답된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingProgressRequest"
            example:
              currentPage: 80
              totalPages: 160
      responses:
        "200":
          description: 독서 진도 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReadingProgressResponse"
              example:
                bookId: 123
                currentPage: 80
                totalPages: 160
                progress: 50.0
                updatedAt: "2026-08-17T21:30:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidPageValue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookProgressAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookProgressNotFound"

  /api/v1/library/shelves:
    post:
      tags: [Shelf]
      operationId: createShelf
      summary: 책장 생성
      description: 로그인 사용자의 서재에 새 책장을 만든다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShelfRequest"
            example:
              name: 완독한 책
      responses:
        "201":
          description: 책장 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShelfResponse"
              example:
                shelfId: 2
                name: 완독한 책
                isDefault: false
                createdAt: "2026-08-21T09:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidShelfData"
        "401":
          $ref: "#/components/responses/Unauthorized"

    get:
      tags: [Shelf]
      operationId: getShelves
      summary: 책장 목록 조회
      description: |
        로그인 사용자의 전체 책장 목록을 조회한다. 기본 책장을 포함한다.
        아직 한 번도 책장을 만들지 않았어도 기본 책장은 항상 조회 결과에 포함된다(필요 시 서버가 자동 생성).
      responses:
        "200":
          description: 책장 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfListResponse"
              example:
                shelves:
                  - shelfId: 1
                    name: 기본 책장
                    isDefault: true
                    bookCount: 12
                  - shelfId: 2
                    name: 완독한 책
                    isDefault: false
                    bookCount: 3
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/library/shelves/{shelfId}:
    parameters:
      - $ref: "#/components/parameters/ShelfId"
    patch:
      tags: [Shelf]
      operationId: updateShelf
      summary: 책장 수정
      description: 책장의 이름을 바꾼다. 기본 책장도 이름을 바꿀 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShelfRequest"
            example:
              name: 다 읽은 책
      responses:
        "200":
          description: 책장 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateShelfResponse"
              example:
                shelfId: 2
                name: 다 읽은 책
                isDefault: false
                updatedAt: "2026-08-21T10:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidShelfData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ShelfAccessDenied"
        "404":
          $ref: "#/components/responses/ShelfNotFound"

    delete:
      tags: [Shelf]
      operationId: deleteShelf
      summary: 책장 삭제
      description: |
        지정한 책장을 삭제한다. 삭제된 책장에 있던 책은 모두 사용자의 기본 책장 맨 뒤로 이동한다.
        기본 책장은 삭제할 수 없다(400, `DEFAULT_SHELF_CANNOT_BE_DELETED`).
      responses:
        "204":
          description: 책장 삭제 성공. 응답 body 없음
        "400":
          $ref: "#/components/responses/DefaultShelfCannotBeDeleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ShelfAccessDenied"
        "404":
          $ref: "#/components/responses/ShelfNotFound"

  /api/v1/library/shelves/{shelfId}/books:
    parameters:
      - $ref: "#/components/parameters/ShelfId"
    get:
      tags: [Shelf]
      operationId: getShelfBooks
      summary: 책장별 책 목록 조회
      description: 지정한 책장에 속한 책 목록을 그 책장 안의 진열 순서(`shelfRank` 오름차순)로 조회한다.
      parameters:
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지당 항목 수
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 책장별 책 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryBookPageResponse"
              example:
                books:
                  - bookId: 123
                    shelfId: 2
                    shelfRank: "m"
                    title: 살인자의 기억법
                    author: 김영하
                    genre: MYSTERY_THRILLER
                    readingStatus: READING
                    coverUrl: https://example.com/covers/9791198765432.jpg
                    progress: 45.0
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ShelfAccessDenied"
        "404":
          $ref: "#/components/responses/ShelfNotFound"

  /api/v1/library/books/{bookId}/scraps:
    parameters:
      - $ref: "#/components/parameters/BookId"
    post:
      tags: [Scrap]
      operationId: createScrap
      summary: 스크랩 생성
      description: OCR 결과 또는 직접 입력한 문장을 현재 선택한 책과 연결하여 스크랩으로 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScrapRequest"
            example:
              sentence: 어른들은 누구나 처음엔 어린이였다.
              pageNumber: 12
              scrapImageUrl: https://example.com/scraps/456.jpg
              memo: 이 문장이 계속 마음에 남는다.
      responses:
        "201":
          description: 스크랩 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다.
                pageNumber: 12
                scrapImageUrl: https://example.com/scraps/456.jpg
                memo: 이 문장이 계속 마음에 남는다.
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidScrapData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

    get:
      tags: [Scrap]
      operationId: getScraps
      summary: 책별 스크랩 목록 조회
      description: 로그인 사용자가 특정 책에 저장한 스크랩 목록을 조회한다.
      parameters:
        - name: page
          in: query
          required: false
          description: 0부터 시작하는 페이지 번호
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지당 항목 수
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 책별 스크랩 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapPageResponse"
              example:
                scraps:
                  - scrapId: 456
                    sentence: 어른들은 누구나 처음엔 어린이였다.
                    pageNumber: 12
                    scrapImageUrl: https://example.com/scraps/456.jpg
                    createdAt: "2026-08-20T10:00:00+09:00"
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibraryBookViewAccessDenied"
        "404":
          $ref: "#/components/responses/LibraryBookViewNotFound"

  /api/v1/library/scraps/{scrapId}:
    parameters:
      - $ref: "#/components/parameters/ScrapId"
    get:
      tags: [Scrap]
      operationId: getScrap
      summary: 스크랩 상세 조회
      description: 저장된 문장과 페이지 번호, 감상 및 메모 등 스크랩 상세 정보를 조회한다.
      responses:
        "200":
          description: 스크랩 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다.
                pageNumber: 12
                scrapImageUrl: https://example.com/scraps/456.jpg
                memo: 이 문장이 계속 마음에 남는다.
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:00:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

    patch:
      tags: [Scrap]
      operationId: updateScrap
      summary: 스크랩 문장/페이지/메모 수정
      description: |
        스크랩의 문장, 페이지 번호, 이미지, 감상 및 메모를 수정한다.
        `sentence`, `pageNumber`, `scrapImageUrl`, `memo`는 항상 모두 포함해야 한다(생략 불가).
        `pageNumber`/`memo`에 `null`을 보내면 해당 값을 삭제하고, 값을 보내면 그 값으로 교체한다.
        `sentence`/`scrapImageUrl`은 `null`을 허용하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScrapRequest"
            example:
              sentence: 어른들은 누구나 처음엔 어린이였다. 그것을 기억하는 어른은 별로 없지만.
              pageNumber: 12
              scrapImageUrl: https://example.com/scraps/456.jpg
              memo: null
      responses:
        "200":
          description: 스크랩 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapDetailResponse"
              example:
                scrapId: 456
                bookId: 123
                sentence: 어른들은 누구나 처음엔 어린이였다. 그것을 기억하는 어른은 별로 없지만.
                pageNumber: 12
                scrapImageUrl: https://example.com/scraps/456.jpg
                memo: null
                createdAt: "2026-08-20T10:00:00+09:00"
                updatedAt: "2026-08-20T10:20:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidScrapData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

    delete:
      tags: [Scrap]
      operationId: deleteScrap
      summary: 스크랩 삭제
      description: 사용자가 자신이 저장한 스크랩을 삭제한다.
      responses:
        "204":
          description: 스크랩 삭제 성공. 응답 body 없음
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScrapAccessDenied"
        "404":
          $ref: "#/components/responses/ScrapNotFound"

  /api/v1/librarian-types:
    get:
      tags: [Librarian]
      operationId: getLibrarianTypes
      summary: 사서 타입 카탈로그 조회
      description: 획득 가능한 동물 사서 타입(러시안블루, 슈빌)별 기본/클릭 시 이미지를 조회한다.
      responses:
        "200":
          description: 사서 타입 카탈로그 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarianTypeListResponse"
              example:
                types:
                  - type: RUSSIAN_BLUE
                    imageUrl: https://example.com/librarians/cat-1.png
                    clickedImageUrl: https://example.com/librarians/cat-1-clicked.png
                  - type: SHOEBILL
                    imageUrl: https://example.com/librarians/bird-1.png
                    clickedImageUrl: https://example.com/librarians/bird-1-clicked.png
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/librarians:
    post:
      tags: [Librarian]
      operationId: acquireLibrarian
      summary: 사서 획득
      description: |
        로그인 사용자가 지정한 타입의 사서를 새로 획득해 이름을 지어준다.
        같은 타입의 사서는 회원당 최대 1마리만 보유할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquireLibrarianRequest"
            example:
              type: RUSSIAN_BLUE
              name: 나비
      responses:
        "201":
          description: 사서 획득 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquireLibrarianResponse"
              example:
                librarianId: 10
                type: RUSSIAN_BLUE
                name: 나비
                level: 1
                experience: 0
                isRepresentative: false
                createdAt: "2026-08-25T10:00:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidLibrarianData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/LibrarianAlreadyOwned"

    get:
      tags: [Librarian]
      operationId: getLibrarians
      summary: 내가 보유한 사서 목록 조회
      description: 로그인 사용자가 보유한 사서 전체를 조회한다.
      responses:
        "200":
          description: 보유 사서 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarianListResponse"
              example:
                librarians:
                  - librarianId: 10
                    type: RUSSIAN_BLUE
                    name: 나비
                    level: 1
                    experience: 0
                    isRepresentative: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/librarians/representative:
    get:
      tags: [Librarian]
      operationId: getRepresentative
      summary: 대표 사서 조회
      description: 로그인 사용자가 지정한 대표 사서를 조회한다. 아직 지정하지 않았으면 404를 반환한다.
      responses:
        "200":
          description: 대표 사서 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepresentativeLibrarianResponse"
              example:
                librarianId: 10
                type: RUSSIAN_BLUE
                name: 나비
                level: 1
                updatedAt: "2026-08-25T10:00:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/RepresentativeLibrarianNotSelected"

  /api/v1/librarians/{librarianId}:
    parameters:
      - $ref: "#/components/parameters/LibrarianId"
    patch:
      tags: [Librarian]
      operationId: renameLibrarian
      summary: 사서 이름 변경
      description: 로그인 사용자가 보유한 사서의 이름을 바꾼다. 언제든 몇 번이든 바꿀 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameLibrarianRequest"
            example:
              name: 루루
      responses:
        "200":
          description: 사서 이름 변경 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameLibrarianResponse"
              example:
                librarianId: 10
                name: 루루
                updatedAt: "2026-08-25T10:05:00+09:00"
        "400":
          $ref: "#/components/responses/InvalidLibrarianData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibrarianAccessDenied"
        "404":
          $ref: "#/components/responses/LibrarianNotFound"

    delete:
      tags: [Librarian]
      operationId: deleteLibrarian
      summary: 사서 방출
      description: 로그인 사용자가 보유한 사서를 방출(논리 삭제)한다.
      responses:
        "204":
          description: 사서 방출 성공. 응답 body 없음
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibrarianAccessDenied"
        "404":
          $ref: "#/components/responses/LibrarianNotFound"

  /api/v1/librarians/{librarianId}/representative:
    parameters:
      - $ref: "#/components/parameters/LibrarianId"
    patch:
      tags: [Librarian]
      operationId: selectRepresentative
      summary: 대표 사서 지정
      description: |
        로그인 사용자가 보유한 사서 중 하나를 대표 사서로 지정한다. 이미 다른 사서가 대표로 지정되어 있으면
        그 사서는 자동으로 대표에서 해제된다. 회원당 대표 사서는 항상 최대 1마리다.
      responses:
        "200":
          description: 대표 사서 지정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepresentativeLibrarianResponse"
              example:
                librarianId: 10
                type: RUSSIAN_BLUE
                name: 나비
                level: 1
                updatedAt: "2026-08-25T10:10:00+09:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LibrarianAccessDenied"
        "404":
          $ref: "#/components/responses/LibrarianNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 인증 서비스가 발급하고 Book Service가 검증하는 access token

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      description: 개인 서재 도서 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 123

    ScrapId:
      name: scrapId
      in: path
      required: true
      description: 스크랩 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 456

    ShelfId:
      name: shelfId
      in: path
      required: true
      description: 책장 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 2

    LibrarianId:
      name: librarianId
      in: path
      required: true
      description: 회원이 보유한 사서 식별자
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: 클라이언트 분기용 안정적인 오류 코드
        message:
          type: string
          minLength: 1
          description: 사용자에게 표시 가능한 한국어 오류 메시지

    ExternalBook:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            알라딘 응답은 "세네카 (지은이), 하와이 대저택 (편역)"처럼 역할 라벨이 붙은 결합 문자열이다.
            서버가 "(지은이)", "(옮긴이)", "(편역)" 등 역할 라벨을 제거하고 이름만 남긴 뒤,
            저자가 여럿이면 쉼표로 구분해 반환한다.
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        publisher:
          type: string
          maxLength: 100
        publishedDate:
          type: string
          format: date
        totalPages:
          type: integer
          format: int32
          minimum: 1
          description: 알라딘 API가 대부분의 도서에서 제공하지 않는 값이다. 없으면 생략되며, 이 경우 사용자가 서재 등록 시 직접 입력해야 한다.
        coverUrl:
          type: string
          format: uri

    BookSearchResponse:
      type: object
      additionalProperties: false
      required: [alreadyRegistered]
      properties:
        alreadyRegistered:
          type: boolean
          description: 로그인 사용자의 서재에 이미 이 isbn으로 등록된 책이 있으면 true
        libraryBook:
          $ref: "#/components/schemas/LibraryBookDetailResponse"
          description: alreadyRegistered가 true일 때만 존재 — 이미 저장된 도서 데이터
        book:
          $ref: "#/components/schemas/ExternalBook"
          description: alreadyRegistered가 false이고 알라딘에서 해당 isbn을 찾았을 때만 존재. 알라딘에도 없으면 생략되며, 사용자가 직접 입력하는 폴백으로 이어진다

    Genre:
      type: string
      enum:
        [
          NONE,
          SCIENCE_FICTION,
          FANTASY,
          ROMANCE,
          MYSTERY_THRILLER,
          LITERARY_FICTION,
          ESSAY,
          POETRY_DRAMA,
          HUMANITIES,
          HISTORY,
          BUSINESS_ECONOMICS,
          SELF_HELP,
          SCIENCE,
          ARTS,
          RELIGION,
          COMPUTER_IT,
        ]
      description: 도서 장르. 생략하면 NONE으로 저장된다.
      default: NONE

    ReadingStatus:
      type: string
      enum: [PLANNED, READING, COMPLETED]
      description: 독서 상태. 생략하면 PLANNED로 저장된다. 진도율(progress)과 자동으로 연동되지 않는 별도 필드다.
      default: PLANNED

    CreateLibraryBookRequest:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 100
        isbn:
          type: string
          pattern: "^(?:[0-9]{10}|[0-9]{13})$"
        genre:
          $ref: "#/components/schemas/Genre"
        publisher:
          type: string
          maxLength: 100
        publishedDate:
          type: string
          format: date
        totalPages:
          type: integer
          format: int32
          minimum: 1
          description: 생략 가능. 알라딘 API가 제공하지 않는 도서가 많아 등록 시점에 모를 수 있다.
        coverUrl:
          type: string
          format: uri
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        shelfId:
          type: integer
          format: int64
          minimum: 1
          description: 등록할 책장. 생략하면 사용자의 기본 책장에 등록한다.

    ShelfRank:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[0-9A-Za-z]+$"
      description: |
        서재 내 정렬 순서를 나타내는 불투명한 LexoRank 키다. 오름차순 문자열(사전식) 비교가 진열 순서다.
        클라이언트는 이 값을 직접 생성·파싱·비교하지 않는다 — 순서 변경은 `reorderLibraryBook`으로만 한다.
      example: "m"

    CreateLibraryBookResponse:
      type: object
      additionalProperties: false
      required: [bookId, shelfId, shelfRank, title, author, genre, readingStatus, currentPage, progress]
      properties:
        bookId:
          type: integer
          format: int64
          minimum: 1
        shelfId:
          type: integer
          format: int64
          minimum: 1
        shelfRank:
          $ref: "#/components/schemas/ShelfRank"
        title:
          type: string
        author:
          type: string
        genre:
          $ref: "#/components/schemas/Genre"
        readingStatus:
          $ref: "#/components/schemas/ReadingStatus"
        currentPage:
          type: integer
