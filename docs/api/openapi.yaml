      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: 인증이 필요합니다.

    InvalidSearchParameter:
      description: 제목과 저자 검색 조건이 모두 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVALID_SEARCH_PARAMETER
            message: 제목 또는 저자 검색 조건이 필요합니다.

    AladinApiError:
      description: 알라딘 API 호출 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ALADIN_API_ERROR
            message: 외부 도서 정보 조회 중 오류가 발생했습니다.

    InvalidCreateBookData:
      description: 서재 등록 필수 도서 정보 누락
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVALID_BOOK_DATA
            message: 필수 도서 정보가 누락되었습니다.

    BookAlreadyRegistered:
      description: 사용자 서재에 이미 등록된 도서
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BOOK_ALREADY_REGISTERED
            message: 이미 서재에 등록된 도서입니다.

    InvalidFilterParameter:
      description: 올바르지 않은 목록 필터 또는 정렬 조건
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INVALID_FILTER_PARAMETER
            message: 올바르지 않은 필터 또는 정렬 조건입니다.

    LibraryBookViewAccessDenied:
      description: 서재 도서 조회 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
