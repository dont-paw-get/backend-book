plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.chc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
	integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	// Boot 4.1의 세분화된 autoconfigure 모듈 체계에서 spring-boot-flyway(FlywayAutoConfiguration)는
	// spring-boot-starter-data-jpa에 딸려오지 않는다 — 이 starter로 명시적으로 가져와야
	// 마이그레이션이 앱 기동 시 자동 실행된다.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// RestClient.Builder 자동 구성(RestClientAutoConfiguration)이 spring-boot-starter-webmvc에
	// 딸려오지 않는다 — Book Discovery(알라딘 API 연동)의 AladinBookDiscoveryClient가 사용
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// 관측(Observability) — Spring Boot 4.1의 공식 OpenTelemetry 스택.
	// micrometer-tracing-bridge-otel + opentelemetry-sdk + opentelemetry-exporter-otlp를 함께 가져온다.
	// 이 starter가 딸려오는 spring-boot-opentelemetry의 OpenTelemetryEnvironmentVariableEnvironmentPostProcessor가
	// OTEL_SERVICE_NAME/OTEL_RESOURCE_ATTRIBUTES/OTEL_EXPORTER_OTLP_ENDPOINT/OTEL_EXPORTER_OTLP_PROTOCOL 같은
	// OTel 표준 환경변수를 Spring 프로퍼티로 직접 매핑하므로, 별도 어댑터 코드나 -javaagent가 필요 없다.
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	// Micrometer Observation은 Spring MVC/RestClient는 계측하지만 JDBC는 계측하지 않는다.
	// PostgreSQL 쿼리 구간 span을 얻으려면 이 라이브러리가 필요하다 — 2.x가 Spring Boot 4 대응 라인이다
	// (2.2.1의 pom이 spring-boot-*:4.0.5에 컴파일되어 있다. 1.x는 Boot 3용이라 쓰지 않는다).
	implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1'
	// 관측(Observability) — Prometheus 메트릭. infra의 HTTP 5xx 에러율·p99 레이턴시 알림이
	// Micrometer 형식 http_server_requests_seconds_* 메트릭을 ServiceMonitor로 스크레이핑해야 동작한다.
	// actuator가 /actuator/prometheus 스크레이프 엔드포인트를 자동 구성하고, registry가 노출 포맷을 담당한다.
	// 노출은 dev overlay에서만 켠다(k8s/overlays/dev) — 공통 application.yaml은 web 노출을 비워 둔다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// Swagger UI 정적 자산(순수 HTML/JS, Spring 애노테이션 스캔 없음) — docs/api/openapi.yaml을
	// 그대로 렌더링하는 뷰어로만 쓴다. API 계약 소스는 계속 openapi.yaml 하나로 유지(CLAUDE.md 단일 소유권)
	implementation 'org.webjars:swagger-ui:5.25.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// io.spring.dependency-management가 spring-boot-dependencies의 testcontainers-bom 중첩 import를 반영하지 못하고,
	// Spring Boot 4.1.0이 명시한 testcontainers.version(2.0.5)은 아직 Maven Central에 게시되지 않아
	// Central에 실재하는 최신 버전을 직접 명시한다. Boot 업그레이드 시 함께 재검토할 것.
	integrationTestImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	integrationTestImplementation 'org.testcontainers:postgresql:1.21.3'
	integrationTestCompileOnly 'org.projectlombok:lombok'
	integrationTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	integrationTestAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('processResources') {
	// docs/api/openapi.yaml(계약의 유일한 소스)을 빌드 시점에 static 리소스로 복사해
	// 앱이 /openapi.yaml로 직접 서빙하게 한다 — 별도로 수동 복사한 사본을 두지 않는다.
	from('docs/api') {
		include 'openapi.yaml'
		into 'static'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
	description = 'PostgreSQL Testcontainers 기반 통합 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
}

tasks.named('check') {
	dependsOn integrationTest
}
