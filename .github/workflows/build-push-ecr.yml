name: Build & Push to ECR

on:
  push:
    branches:
      - develop         # develop → dev 환경
      - main            # main → prod 환경
    paths-ignore:
      - "k8s/**"         # 태그 갱신 커밋이 무한루프 도는 것 방지
      - "argocd/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}  # 수동 실행도 허용

# ECR 로그인에 IAM 유저 Access Key / Secret Key 사용
permissions:
  contents: write        # 매니페스트 이미지 태그 갱신 커밋을 위해

env:
  AWS_REGION: ap-northeast-2
  # dev·prod 클러스터 노드가 arm64(Graviton)를 포함하므로 항상 멀티아키로 빌드한다.
  # 단일 아키텍처(amd64)로 빌드하면 arm64 노드에서 "exec format error" 로 죽는다.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 멀티아키 빌드용 buildx 빌더. Dockerfile 의 빌드 스테이지가
      # --platform=$BUILDPLATFORM 로 러너(amd64)에 고정되어 있어 Gradle 은 한 번만 돌고,
      # arm64 스테이지는 jar COPY 뿐이라 실제 에뮬레이션 실행은 없다.
      # (QEMU 는 런타임 스테이지에 RUN 이 추가될 경우를 대비한 안전장치)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 브랜치별로 대상 ECR 리포/overlay/환경명과 push 할 태그 목록을 결정합니다.
      #   develop → dev  (dpyb-dev/dpyb-book,  MUTABLE  → develop-latest 등 movable 태그 OK)
      #   main    → prod (dpyb-prod/dpyb-book, IMMUTABLE → 커밋 SHA 태그만 push)
      - name: Resolve target by branch
        id: target
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            ENV_NAME=prod
            ECR_REPOSITORY=dpyb-prod/dpyb-book
            OVERLAY=k8s/overlays/prod/kustomization.yaml
            IMMUTABLE=true
          else
            ENV_NAME=dev
            ECR_REPOSITORY=dpyb-dev/dpyb-book
            OVERLAY=k8s/overlays/dev/kustomization.yaml
            IMMUTABLE=false
          fi
          {
            echo "env=${ENV_NAME}"
            echo "ecr_repository=${ECR_REPOSITORY}"
            echo "overlay=${OVERLAY}"
            echo "immutable=${IMMUTABLE}"
          } >> "$GITHUB_OUTPUT"

          # buildx 멀티플랫폼 빌드는 로컬 이미지가 남지 않아 `docker tag` 를 쓸 수 없다.
          # 그래서 push 할 태그를 여기서 모두 계산해 build-push-action 에 한꺼번에 넘긴다.
          # 커밋 SHA 태그는 항상 (immutable/mutable 공통, 실제 배포에 쓰는 태그),
          # movable 태그(<branch>-latest)는 같은 태그 재push 가 가능한 MUTABLE 리포(dev)에서만.
          {
            echo "tags<<TAGS_EOF"
            echo "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            if [ "$IMMUTABLE" != "true" ]; then
              echo "${REGISTRY}/${ECR_REPOSITORY}:${REF_NAME}-latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: ${{ steps.target.outputs.tags }}
          # provenance attestation 을 끄면 ECR 매니페스트에 unknown/unknown 항목이
          # 붙지 않아 이미지 목록이 아키텍처 2개로만 깔끔하게 보인다.
          provenance: false

      - name: Bump overlay image tag (GitOps)
        env:
          IMAGE_TAG: ${{ github.sha }}
          KFILE: ${{ steps.target.outputs.overlay }}
          ENV_NAME: ${{ steps.target.outputs.env }}
        run: |
          # kustomization.yaml 의 newTag 값을 커밋 SHA 로 치환
          sed -i -E "s/^(\s*newTag:).*/\1 ${IMAGE_TAG}/" "$KFILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet "$KFILE"; then
            echo "이미지 태그 변경 없음"
          else
            git add "$KFILE"
            git commit -m "chore(deploy): bump ${ENV_NAME} image tag to ${IMAGE_TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
